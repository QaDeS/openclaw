version: "3.8"

services:
  openclaw:
    build:
      context: /home/claw
      dockerfile: Dockerfile.openclaw
    container_name: openclaw_daemon
    volumes:
      - /home/claw/openclaw:/app
      - /home/claw/.openclaw:/root/.openclaw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOCAL_LLM_URL=${LOCAL_LLM_URL}
    network_mode: host
